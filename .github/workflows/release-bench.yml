name: Release native Criterion benchmarks

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }} benchmark
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            extension: ''
          - os: macos
            runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
            extension: ''
          - os: linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            extension: ''
          - os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            extension: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Compile benchmark executable
        env:
          TARGET: ${{ matrix.target }}
        run: cargo bench --target "$TARGET" --bench tree --no-run --message-format=json-render-diagnostics > bench-artifacts.json
        shell: bash
      - name: Package executable
        env:
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          BENCH_BIN="$(node - "$TARGET" <<'JS'
          const fs = require("node:fs");
          const target = process.argv[2];
          for (const line of fs.readFileSync("bench-artifacts.json", "utf8").split(/\r?\n/)) {
            if (!line) continue;
            const message = JSON.parse(line);
            if (message.reason === "compiler-artifact" && message.target?.name === "tree" && message.target.kind?.includes("bench") && message.executable) {
              process.stdout.write(message.executable);
              process.exit(0);
            }
          }
          console.error(`No benchmark executable found for ${target}`);
          process.exit(1);
          JS
          )"
          ASSET="tree-bench-$OS-$ARCH$EXTENSION"
          cp "$BENCH_BIN" "$ASSET"
          if [[ "$OS" != "windows" ]]; then chmod +x "$ASSET"; fi
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: bench-executable-${{ matrix.os }}-${{ matrix.arch }}
          path: tree-bench-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}
          if-no-files-found: error

  combine-macos:
    name: Combine macOS benchmark architectures
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bench-executable-macos-arm64
          path: arm64
      - uses: actions/download-artifact@v4
        with:
          name: bench-executable-macos-x86_64
          path: x86_64
      - name: Create universal executable
        run: |
          lipo -create \
            arm64/tree-bench-macos-arm64 \
            x86_64/tree-bench-macos-x86_64 \
            -output tree-bench-macos-universal
          chmod +x tree-bench-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: bench-executable-macos-universal
          path: tree-bench-macos-universal
          if-no-files-found: error

  release:
    needs: [build, combine-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bench-executable-macos-universal
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: bench-executable-linux-x86_64
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: bench-executable-windows-x86_64
          path: release-assets
      - name: Mark Unix release assets executable
        run: |
          find release-assets -type f ! -name '*.exe' -exec chmod +x {} +
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/tree-bench-*
          fail_on_unmatched_files: true
