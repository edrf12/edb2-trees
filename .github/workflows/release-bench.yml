name: Release macOS Criterion benchmarks

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} benchmark
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Compile benchmark executable
        env:
          TARGET: ${{ matrix.target }}
        run: cargo bench --target "$TARGET" --bench tree --no-run --message-format=json-render-diagnostics > bench-artifacts.json
      - name: Package executable
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          BENCH_BIN="$(python3 - "$TARGET" <<'PY'
          import json
          import sys

          target = sys.argv[1]
          with open("bench-artifacts.json", encoding="utf-8") as artifacts:
              for line in artifacts:
                  message = json.loads(line)
                  if message.get("reason") != "compiler-artifact":
                      continue
                  built = message.get("target", {})
                  if built.get("name") == "tree" and "bench" in built.get("kind", []):
                      executable = message.get("executable")
                      if executable:
                          print(executable)
                          break
              else:
                  raise SystemExit(f"No benchmark executable found for {target}")
          PY
          )"
          cp "$BENCH_BIN" "tree-bench-macos-$ARCH"
          chmod +x "tree-bench-macos-$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-executable-${{ matrix.arch }}
          path: tree-bench-macos-${{ matrix.arch }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-executable-*
          merge-multiple: true
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/tree-bench-macos-*
          fail_on_unmatched_files: true
