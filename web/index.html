<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Binary Tree Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header><h1>Binary Tree Simulator</h1><p>Build a tree. Follow what changes.</p></header>
    <main>
      <aside>
        <div class="field"><label for="kind">Tree</label><select id="kind"><option value="avl">AVL</option><option value="rb">Red-black</option></select></div>
        <div class="field"><label for="key">Key</label><input id="key" type="number" step="1" placeholder="e.g. 42"></div>
        <div class="actions">
          <button id="insert">Insert</button><button id="delete">Delete</button>
          <button id="search">Search</button><button id="reset">Reset</button>
        </div>
        <p class="note" id="status" aria-live="polite">Enter a key to begin.</p>
        <div class="legend"><strong>AVL</strong> shows height and balance.<br><strong>Red-black</strong> nodes use red and slate colors.<br><br>Use the timeline or arrow keys to review frames.</div>
      </aside>
      <section class="stage" aria-label="Tree visualization">
        <svg id="tree" role="img" aria-label="Current tree"></svg>
      </section>
    </main>
    <footer>
      <button id="previous" aria-label="Previous frame">←</button>
      <button id="play" aria-label="Play frames">▶</button>
      <button id="next" aria-label="Next frame">→</button>
      <span id="step-label">Step 1 of 1</span>
      <input id="timeline" type="range" min="0" max="0" value="0" aria-label="Transition frame">
      <span id="event">Ready</span>
    </footer>
  </div>
  <script type="module">
    import init, { BrowserTree } from './pkg/edb2_avl_rbtree.js';
    let tree, kind = 'avl', frames = [], frameIndex = 0, timer = null, autoplay = false;
    let nodeLayer, edgeLayer;
    const nodeElements = new Map(), edgeElements = new Map();
    const svgNamespace = 'http://www.w3.org/2000/svg';
    const svg = document.querySelector('#tree');
    const status = document.querySelector('#status');
    const kindInput = document.querySelector('#kind');
    const timeline = document.querySelector('#timeline');
    const keyInput = document.querySelector('#key');
    function decodeResult(json) { return JSON.parse(json); }
    function snapshot() { return JSON.parse(tree.snapshot_json()).root; }
    function operate(operation, key) {
      const result = decodeResult(tree[operation](key));
      frames = result.frames;
      frameIndex = 0;
      if (autoplay) startPlayback();
      status.textContent = result.result;
      renderFrame();
    }
    function svgElement(name, attributes = {}) {
      const element = document.createElementNS(svgNamespace, name);
      for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
      return element;
    }
    function ensureLayers() {
      if (nodeLayer?.isConnected && edgeLayer?.isConnected) return;
      svg.replaceChildren();
      const defs = svgElement('defs');
      const marker = svgElement('marker', { id: 'arrow', markerWidth: 8, markerHeight: 8, refX: 6, refY: 3, orient: 'auto' });
      marker.append(svgElement('path', { d: 'M0,0 L0,6 L6,3 z', fill: '#718591' }));
      defs.append(marker);
      edgeLayer = svgElement('g', { class: 'edges' });
      nodeLayer = svgElement('g', { class: 'nodes' });
      svg.append(defs, edgeLayer, nodeLayer);
    }
    function makeNodeElement() {
      const group = svgElement('g', { class: 'node', opacity: 0 });
      group.append(svgElement('circle', { cx: 0, cy: 0, r: 24 }));
      const key = svgElement('text', { x: 0, y: 0 });
      const metaOne = svgElement('text', { class: 'meta', x: 31, y: -5 });
      const metaTwo = svgElement('text', { class: 'meta', x: 31, y: 13 });
      group.append(key, metaOne, metaTwo);
      return group;
    }
    function setNodePosition(element, x, y) {
      element.style.transform = `translate(${x}px, ${y}px)`;
    }
    function updateEdge(path, d) {
      const oldPath = path.getAttribute('d');
      path.setAttribute('d', d);
      if (oldPath && oldPath !== d && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        path.querySelector('animate')?.remove();
        const animation = svgElement('animate', { attributeName: 'd', from: oldPath, to: d, dur: '.38s', fill: 'freeze' });
        path.append(animation);
        animation.beginElement?.();
      }
    }
    function renderFrame() {
      const current = frames[frameIndex] ?? { label: 'Ready', snapshot: snapshot(), affected_key: null };
      const nodes = [];
      function place(node, depth = 0) { if (!node) return; place(node.left, depth + 1); nodes.push({ node, depth, order: nodes.length }); place(node.right, depth + 1); }
      place(current.snapshot.root);
      const width = Math.max(svg.clientWidth, 640), row = 112, top = 64;
      const heightPx = Math.max(420, top + (Math.max(1, ...nodes.map(n => n.depth + 1))) * row + 45);
      svg.setAttribute('viewBox', `0 0 ${width} ${heightPx}`); svg.setAttribute('height', heightPx);
      if (!nodes.length) {
        svg.replaceChildren(); nodeLayer = edgeLayer = null; nodeElements.clear(); edgeElements.clear();
        svg.append(svgElement('text', { class: 'empty', x: width / 2, y: heightPx / 2 }));
        svg.lastChild.textContent = 'An empty tree. Insert a key to begin.';
      }
      else {
        ensureLayers();
        const positions = new Map();
        nodes.forEach((entry, index) => positions.set(entry.node, { x: width * (index + 1) / (nodes.length + 1), y: top + entry.depth * row }));
        const visibleEdges = new Set();
        for (const { node } of nodes) for (const child of [node.left, node.right]) if (child) {
          const edgeKey = `${node.key}:${child.key}`;
          visibleEdges.add(edgeKey);
          const from = positions.get(node), to = positions.get(child);
          let path = edgeElements.get(edgeKey);
          if (!path) {
            path = svgElement('path', { class: 'edge', opacity: 0, 'marker-end': 'url(#arrow)' });
            edgeElements.set(edgeKey, path); edgeLayer.append(path);
          }
          updateEdge(path, `M ${from.x} ${from.y + 24} C ${from.x} ${from.y + 62}, ${to.x} ${to.y - 62}, ${to.x} ${to.y - 24}`);
          requestAnimationFrame(() => path.setAttribute('opacity', '1'));
        }
        for (const [edgeKey, path] of edgeElements) if (!visibleEdges.has(edgeKey)) {
          edgeElements.delete(edgeKey); path.setAttribute('opacity', '0'); setTimeout(() => path.remove(), 350);
        }
        const visibleNodes = new Set();
        for (const {node} of nodes) {
          const nodeKey = String(node.key); visibleNodes.add(nodeKey);
          const {x,y} = positions.get(node);
          const metadata = kind === 'avl' ? [`h=${node.metadata.height}`, `bf=${node.metadata.balance}`] : ['color', node.metadata.color];
          let element = nodeElements.get(nodeKey);
          if (!element) {
            element = makeNodeElement(); nodeElements.set(nodeKey, element); nodeLayer.append(element);
            requestAnimationFrame(() => element.setAttribute('opacity', '1'));
          }
          element.setAttribute('class', `node ${kind === 'rb' ? node.metadata.color : ''}${current.affected_key === node.key ? ' pivot' : ''}`);
          setNodePosition(element, x, y);
          element.children[1].textContent = String(node.key);
          element.children[2].textContent = metadata[0];
          element.children[3].textContent = metadata[1];
        }
        for (const [nodeKey, element] of nodeElements) if (!visibleNodes.has(nodeKey)) {
          nodeElements.delete(nodeKey); element.setAttribute('opacity', '0'); setTimeout(() => element.remove(), 350);
        }
      }
      timeline.max = String(Math.max(0, frames.length - 1)); timeline.value = String(frameIndex);
      document.querySelector('#step-label').textContent = `Step ${frameIndex + 1} of ${frames.length}`;
      document.querySelector('#event').textContent = current.label;
    }
    function readKey() { const value = Number(keyInput.value); if (!Number.isInteger(value)) { status.textContent = 'Enter a whole-number key.'; return null; } return value; }
    function runFromKey(operation) {
      const key = readKey();
      if (key === null) return;
      operate(operation, key);
      keyInput.value = '';
    }
    document.querySelector('#insert').onclick = () => runFromKey('insert');
    document.querySelector('#delete').onclick = () => runFromKey('delete');
    document.querySelector('#search').onclick = () => runFromKey('search');
    keyInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') { event.preventDefault(); runFromKey('insert'); }
    });
    document.querySelector('#reset').onclick = () => { const empty = JSON.parse(tree.reset()); frames = [{label:'Tree reset', snapshot:empty, affected_key:null}]; frameIndex = 0; status.textContent = 'Tree reset.'; renderFrame(); };
    kindInput.onchange = () => { kind = kindInput.value; const empty = JSON.parse(tree.switch_tree(kind)); frames = [{label:`New ${kind === 'avl' ? 'AVL' : 'red-black'} tree`, snapshot:empty, affected_key:null}]; frameIndex = 0; status.textContent = 'Tree type changed; started a new empty tree.'; renderFrame(); };
    document.querySelector('#previous').onclick = () => { frameIndex = Math.max(0, frameIndex - 1); renderFrame(); };
    document.querySelector('#next').onclick = () => { frameIndex = Math.min(frames.length - 1, frameIndex + 1); renderFrame(); };
    const playButton = document.querySelector('#play');
    function startPlayback() {
      if (timer) return;
      playButton.textContent = 'Ⅱ'; playButton.setAttribute('aria-label', 'Pause frames');
      timer = setInterval(() => {
        if (frameIndex >= frames.length - 1) { clearInterval(timer); timer = null; return; }
        frameIndex++; renderFrame();
      }, 700);
    }
    function pausePlayback() { autoplay = false; clearInterval(timer); timer = null; playButton.textContent = '▶'; playButton.setAttribute('aria-label', 'Play frames'); }
    function togglePlayback() {
      if (autoplay) { pausePlayback(); return; }
      if (frameIndex >= frames.length - 1) { frameIndex = 0; renderFrame(); }
      autoplay = true; startPlayback();
    }
    playButton.onclick = togglePlayback;
    timeline.oninput = () => { frameIndex = Number(timeline.value); renderFrame(); if (autoplay) startPlayback(); };
    window.addEventListener('keydown', event => {
      if (event.code === 'Space') {
        event.preventDefault();
        togglePlayback();
      } else if (event.key === 'ArrowLeft') {
        event.preventDefault();
        frameIndex = Math.max(0, frameIndex - 1);
        renderFrame();
        if (autoplay) startPlayback();
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        frameIndex = Math.min(frames.length - 1, frameIndex + 1);
        renderFrame();
        if (autoplay) startPlayback();
      }
    });
    window.addEventListener('resize', renderFrame);
    await init();
    tree = new BrowserTree(kind);
    frames = [{label:'Ready', snapshot:snapshot(), affected_key:null}]; renderFrame();
  </script>
</body>
</html>
